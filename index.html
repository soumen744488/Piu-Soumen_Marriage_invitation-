<style>
:root{
  --navy:#14224a; --navy-2:#1d2f63; --ivory:#fbf7ee; --paper:#f3ecdb;
  --gold:#b08a3e; --ink:#1b2340; --muted:#6a7089;
  --indic:'Noto Sans Bengali','Noto Sans Devanagari','Noto Sans Oriya','Noto Sans Telugu';
  --serif:'Cormorant Garamond',var(--indic),Georgia,'Times New Roman',serif;
  --sans:'Jost',var(--indic),system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ivory);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
section{padding:72px 24px;max-width:760px;margin:0 auto;text-align:center}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.15}
.rule{width:110px;height:1px;margin:22px auto;position:relative;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
.rule::after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;background:var(--gold);transform:translateX(-50%) rotate(45deg)}

/* hero */
.hero{background:var(--navy);color:var(--ivory);max-width:none;padding:56px 24px 72px;position:relative;overflow:hidden;text-align:center}
.hero>.in{max-width:520px;margin:0 auto;position:relative;z-index:1}
.feather{position:absolute;top:-10px;width:120px;height:240px;opacity:.5;pointer-events:none}
.feather.l{left:-18px;transform:rotate(-16deg)}
.feather.r{right:-18px;transform:scaleX(-1) rotate(-16deg)}
.blessing{font-family:var(--serif);font-size:1.15rem;color:#d9bf85;letter-spacing:.04em;margin-bottom:28px}
.arch{width:min(78vw,320px);aspect-ratio:4/5;margin:0 auto 34px;border-radius:999px 999px 6px 6px;overflow:hidden;border:1px solid var(--gold);padding:7px}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;border-radius:999px 999px 2px 2px;display:block}
.names{font-size:clamp(2.6rem,10vw,4.2rem);font-weight:400}
.names span{display:block;font-style:italic;font-size:.45em;color:#d9bf85;margin:.15em 0}
.invite{font-family:var(--serif);font-style:italic;font-size:1.2rem;margin-top:22px;color:#e8e1cf}
.when{margin-top:26px;font-size:.95rem;letter-spacing:.1em;color:#d9bf85}
/* one orchestrated entrance on page load */
.hero .in>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero .in>:nth-child(2){animation-delay:.15s}.hero .in>:nth-child(3){animation-delay:.3s}
.hero .in>:nth-child(4){animation-delay:.45s}.hero .in>:nth-child(5){animation-delay:.6s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* countdown */
.count{display:flex;justify-content:center;gap:clamp(16px,6vw,40px);margin-top:8px}
.count div{min-width:56px}
.count b{display:block;font-family:var(--serif);font-weight:500;font-size:2.6rem;line-height:1}
.count small{font-size:.8rem;color:var(--muted)}

/* cards */
.events,.gifts,.cardlist{display:grid;gap:20px;margin-top:34px;text-align:left}
@media(min-width:640px){.events,.gifts,.cardlist{grid-template-columns:1fr 1fr}}
.event,.gift{background:var(--paper);border-radius:4px;padding:30px 26px;border-top:2px solid var(--gold);position:relative}
.event::after,.gift::after{content:"";position:absolute;right:10px;bottom:10px;width:18px;height:18px;border-right:1px solid var(--gold);border-bottom:1px solid var(--gold);opacity:.7}
.event h3{font-size:2rem}
.event .date{font-family:var(--serif);font-size:1.25rem;margin-top:8px}
.event .meta{color:var(--muted);font-size:.95rem;margin-top:2px}
.event .place{margin-top:14px;font-weight:400}
.gift h3{font-size:1.7rem}
.gift .val{margin-top:10px;font-weight:400;word-break:break-all;user-select:all}
.gift p.note{color:var(--muted);font-size:.9rem;margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{font:inherit;font-weight:400;font-size:.92rem;cursor:pointer;text-decoration:none;display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid var(--navy);background:var(--navy);color:var(--ivory);transition:background .2s,color .2s}
.btn:hover{background:var(--navy-2)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:var(--navy);color:var(--ivory)}
.all{margin-top:34px;display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.trip summary{cursor:pointer;list-style:none;display:inline-block;padding:10px 18px;border:1px solid var(--navy);border-radius:999px;font-size:.92rem;font-weight:400;color:var(--navy)}
.trip summary::-webkit-details-marker{display:none}
.trip summary:hover,.trip[open] summary{background:var(--navy);color:var(--ivory)}
.routes{margin-top:22px;text-align:left;display:grid;gap:26px}
.route h3{font-size:1.5rem;margin-bottom:8px}
.train{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;padding:14px 0;border-top:1px solid #dcd3bb}
.train .no{font-family:var(--serif);font-size:1.3rem;color:var(--gold);grid-row:span 2;align-self:center;min-width:58px}
.train .nm{font-weight:400}
.train .tm{color:var(--muted);font-size:.92rem}
.note-sm{color:var(--muted);font-size:.85rem;margin-top:22px}
.cardbox{text-align:center}
.cardbox img{width:100%;max-width:300px;height:auto;border-radius:4px;display:block;margin:0 auto 14px;border:1px solid #dcd3bb}
.cardbox h3,.qrbox h3{font-size:1.5rem;margin-bottom:10px}
.qrbox{margin-top:34px}
#qr{display:inline-block;padding:10px;background:#fff;border:1px solid #dcd3bb;border-radius:4px;margin-bottom:14px}
#qr img{display:none!important}
h2{font-size:2.4rem}
.lead{max-width:46ch;margin:14px auto 0;color:var(--muted)}
footer{background:var(--navy);color:#d9bf85;text-align:center;padding:40px 24px;font-family:var(--serif);font-size:1.2rem}
footer small{display:block;font-family:var(--sans);font-size:.8rem;color:#9aa3c4;margin-top:6px}

/* floating controls */
#langSel{position:fixed;top:12px;right:12px;z-index:10;font:inherit;font-size:.85rem;padding:7px 12px;border-radius:999px;border:1px solid var(--gold);background:rgba(20,34,74,.85);color:var(--ivory);backdrop-filter:blur(6px)}
#langSel option{color:#000}
#music{position:fixed;left:14px;bottom:14px;z-index:10;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:var(--navy);color:#d9bf85;font-size:1.2rem;cursor:pointer;line-height:1;position:fixed}
#music[aria-pressed="false"]::after{content:"";position:absolute;left:10px;right:10px;top:50%;height:1.5px;background:#d9bf85;transform:rotate(-40deg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{.actions,.all,.toast,#langSel,#music{display:none}}
</style>
</head>

const LOC = {en:"en-IN",hi:"hi-IN",bn:"bn-IN",or:"or-IN",te:"te-IN"};
/* ============================================== */

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
let lang = "en";
const t = k => (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : I18N.en[k];
const parse = (d,tm) => new Date(d + "T" + (tm || "00:00") + ":00");
const longDate = d => parse(d).toLocaleDateString(LOC[lang],{day:"numeric",month:"long",year:"numeric"});
const weekday = d => parse(d).toLocaleDateString(LOC[lang],{weekday:"long"});
const fmtTime = (d,tm) => parse(d,tm).toLocaleTimeString(LOC[lang],{hour:"numeric",minute:"2-digit",hour12:true});
const stamp = (d,tm) => d.replaceAll("-","") + (tm ? "T" + tm.replace(":","") + "00" : "");
const addDay = d => { const x = parse(d); x.setDate(x.getDate()+1); return x.getFullYear()+pad(x.getMonth()+1)+pad(x.getDate()); };
const names = CONFIG.bride.split(" ")[0] + " & " + CONFIG.groom.split(" ")[0];

function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

/* ---------- calendar ---------- */
function range(e){
  if(e.start){
    let end = e.end;
    if(!end){ const [h,m] = e.start.split(":").map(Number); end = pad(Math.min(h+3,23)) + ":" + pad(h+3>23?59:m); }
    return [stamp(e.date,e.start), stamp(e.date,end)];
  }
  return [e.date.replaceAll("-",""), addDay(e.date)];
}
function googleCal(e){
  const [a,b] = range(e);
  const p = new URLSearchParams({action:"TEMPLATE",text:`${e.title} – ${names}`,dates:`${a}/${b}`,location:e.venue,details:`Wedding of ${CONFIG.bride} & ${CONFIG.groom}.\nDirections: ${e.mapUrl}`});
  return "https://calendar.google.com/calendar/render?" + p;
}
function icsBody(list){
  const esc = s => s.replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
  const ev = list.map((e,i)=>{
    const [a,b] = range(e), allDay = !e.start;
    return ["BEGIN:VEVENT",`UID:wedding-${i}-${e.date}@invite`,`DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g,"")}`,
      allDay?`DTSTART;VALUE=DATE:${a}`:`DTSTART:${a}`, allDay?`DTEND;VALUE=DATE:${b}`:`DTEND:${b}`,
      `SUMMARY:${esc(e.title+" – "+names)}`,`LOCATION:${esc(e.venue)}`,`DESCRIPTION:${esc("Directions: "+e.mapUrl)}`,"END:VEVENT"].join("\r\n");
  });
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Wedding Invite//EN",...ev,"END:VCALENDAR"].join("\r\n");
}
function downloadIcs(list,name){
  const url = URL.createObjectURL(new Blob([icsBody(list)],{type:"text/calendar"}));
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000); toast(t("calD"));
}

/* ---------- render (re-runs when language changes) ---------- */
function renderEvents(){
  $("#eventList").innerHTML = CONFIG.events.map((e,i)=>`
    <article class="event">
      <h3>${t("ev"+i) || e.title}</h3>
      <p class="date">${longDate(e.date)}</p>
      <p class="meta">${weekday(e.date)}${e.start?", "+fmtTime(e.date,e.start):""}</p>
      <p class="place">${e.venue}</p>
      <div class="actions">
        <a class="btn" href="${e.mapUrl}" target="_blank" rel="noopener">${t("dir")}</a>
        <a class="btn ghost" href="${googleCal(e)}" target="_blank" rel="noopener">${t("gcal")}</a>
        <button class="btn ghost" data-ics="${i}">${t("ics")}</button>
      </div>
    </article>`).join("");
}
function renderTrains(){
  const el = $("#routes"); if(!el) return;
  el.innerHTML = CONFIG.trains.map(r=>`
    <div class="route"><h3>${r.route}</h3>
    ${r.list.map(x=>`<div class="train"><span class="no">${x.no}</span>
      <span class="nm">${x.name}</span>
      <span class="tm">${x.dep} – ${x.arr} · ${x.dur} · ${x.days}</span></div>`).join("")}
    </div>`).join("");
}
function renderCards(){
  const el = $("#cardList"); if(!el) return;
  el.innerHTML = CONFIG.cards.map(c=>`
    <div class="cardbox"><h3>${t(c.key)}</h3>
      <img src="${c.file}" alt="${t(c.key)}" loading="lazy">
      <a class="btn" href="${c.file}" download="${c.download}">${t("dl")}</a></div>`).join("");
}
function applyLang(l){
  if(!I18N[l]) l = "en";
  lang = l; document.documentElement.lang = l;
  try{ localStorage.setItem("lang",l); }catch(_){}
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent = t(el.dataset.i18n));
  const [a,c,b] = t("names");
  $("#names").innerHTML = `${a}<span>${c}</span>${b}`;
  $("#footNames").textContent = `${a} ${c} ${b}`;
  document.title = `${a} ${c} ${b}`;
  $("#music").title = $("#music").ariaLabel = t("music");
  $("#heroDate").textContent = longDate(CONFIG.events[0].date);
  $("#rsvpBtn").textContent = CONFIG.whatsapp ? t("rsvpB") : t("rsvpS");
  $("#langSel").value = l;
  renderEvents(); renderTrains(); renderCards();
}

$("#eventList").addEventListener("click",ev=>{
  const b = ev.target.closest("[data-ics]"); if(!b) return;
  const e = CONFIG.events[b.dataset.ics];
  downloadIcs([e], e.title.replace(/\s+/g,"-").toLowerCase()+".ics");
});
$("#allIcs").onclick = ()=>downloadIcs(CONFIG.events,"wedding-invitation.ics");

/* ---------- countdown ---------- */
const target = parse(CONFIG.events[0].date, CONFIG.events[0].start);
function tick(){
  const s = Math.floor(Math.max(0, target - new Date())/1000);
  $("#d").textContent = Math.floor(s/86400);
  $("#h").textContent = pad(Math.floor(s%86400/3600));
  $("#m").textContent = pad(Math.floor(s%3600/60));
  $("#s").textContent = pad(s%60);
}
tick(); setInterval(tick,1000);

/* ---------- blessing zone ---------- */
if(CONFIG.showBlessings){
  $("#giftEmail").textContent = CONFIG.giftEmail;
  $("#upiId").textContent = CONFIG.upiId;
  $("#upiPay").href = `upi://pay?pa=${encodeURIComponent(CONFIG.upiId)}&pn=${encodeURIComponent(CONFIG.upiName)}&cu=INR`;
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    const text = document.getElementById(b.dataset.copy).textContent;
    try{ await navigator.clipboard.writeText(text); toast(t("copied")); }catch(_){ toast(t("copyFail")); }
  });
}

/* ---------- QR code ---------- */
if(CONFIG.showCards){
  const url = CONFIG.siteUrl || location.href.split(/[?#]/)[0];
  if(typeof QRCode !== "undefined"){
    new QRCode($("#qr"),{text:url,width:200,height:200,colorDark:"#14224a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  }
  $("#qrDl").onclick = ()=>{
    const c = $("#qr canvas"); if(!c) return;
    const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "invitation-qr.png"; a.click();
  };
}

/* ---------- share + RSVP ---------- */
async function share(){
  const data = {title:document.title,text:`${names} – Wedding Invitation`,url:CONFIG.siteUrl || location.href.split("?")[0]};
  if(navigator.share){ try{ await navigator.share(data); }catch(_){} }
  else { try{ await navigator.clipboard.writeText(data.url); toast(t("linkC")); }catch(_){ toast(t("copyFail")); } }
}
$("#share").onclick = share;
const rsvpBtn = $("#rsvpBtn");
if(CONFIG.whatsapp){
  rsvpBtn.href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(`Hello! I'll be attending the wedding of ${names}.`)}`;
  rsvpBtn.target = "_blank"; rsvpBtn.rel = "noopener";
} else rsvpBtn.onclick = e=>{ e.preventDefault(); share(); };

/* ---------- soft music (built-in melody or your own mp3) ---------- */
const musicBtn = $("#music");
let playing = false, ac, master, timer, drones = [], audio;
function startSynth(){
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(.16, ac.currentTime + 2.5);
  [[130.81,.5],[196,.3],[261.63,.18]].forEach(([f,v])=>{       // tanpura-like drone: Sa, Pa, Sa
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = f; g.gain.value = v;
    o.connect(g).connect(master); o.start(); drones.push(o);
  });
  const scale = [261.63,293.66,329.63,392,440,523.25,587.33];   // raga Bhoopali notes
  let i = 2;
  const note = ()=>{
    i = Math.max(0, Math.min(scale.length-1, i + [-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));
    const now = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle"; o.frequency.value = scale[i];
    g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(.32,now+.06); g.gain.exponentialRampToValueAtTime(.001,now+3);
    o.connect(g).connect(master); o.start(now); o.stop(now+3.2);
  };
  note(); timer = setInterval(note, 2200);
}
function stopSynth(){
  clearInterval(timer);
  if(master) master.gain.linearRampToValueAtTime(0, ac.currentTime + .8);
  const old = ac, d = drones; drones = [];
  setTimeout(()=>{ d.forEach(o=>{try{o.stop()}catch(_){}}); if(old) old.close(); }, 900);
}
musicBtn.onclick = ()=>{
  playing = !playing;
  musicBtn.setAttribute("aria-pressed", playing);
  if(CONFIG.music){
    audio = audio || Object.assign(new Audio(CONFIG.music),{loop:true,volume:.4});
    playing ? audio.play().catch(()=>{}) : audio.pause();
  } else playing ? startSynth() : stopSynth();
};

/* ---------- language ---------- */
$("#langSel").onchange = e=>applyLang(e.target.value);
let saved = null; try{ saved = localStorage.getItem("lang"); }catch(_){}
applyLang(new URLSearchParams(location.search).get("lang") || saved || "en");
